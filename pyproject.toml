[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runpod-pod-preempt-receipt"
version = "1.0.0"
description = "Checkpoint-bound preemption recovery receipts and restart grants"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pod-preempt-receipt = "pod_preempt_cli:main"

[tool.setuptools]
py-modules = ["pod_preempt_receipt", "pod_preempt_cli", "promotion_authority"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
